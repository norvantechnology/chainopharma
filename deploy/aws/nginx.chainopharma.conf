# HTTP → HTTPS (ACME challenge allowed)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 15-252-130-60.sslip.io admin.15-252-130-60.sslip.io 15.252.130.60 chainopharma.com www.chainopharma.com _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# User panel (wholesaler / retailer)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 15-252-130-60.sslip.io 15.252.130.60 chainopharma.com www.chainopharma.com;

    ssl_certificate /etc/letsencrypt/live/15-252-130-60.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/15-252-130-60.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/chainopharma/frontend;
    index index.html;
    client_max_body_size 25m;

    # Pure API prefixes — always proxy to Node (no SPA page at these paths).
    location ~ ^/(hello|auth|access|api|products|sales-invoices|notifications|import|registration|supplier-products|vendor-manufacturers|uploads|api-docs)(/|$) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout 120s;
    }

    # Shared SPA page + API prefixes.
    # Browser refresh / document navigation (Accept: text/html) → index.html
    # App fetch/XHR (Accept: application/json) → API
    location ~ ^/(reports/(inventory|ledger|day-book|gstr-1|gstr-2|product-supplier|mfg-stockist|non-moving)|gst-returns|customers|mfg-companies|purchase-invoices|purchase-returns|sales-returns|division-payments|vendor-payments|customer-payments|divisions|vendors|orders|wholesaler-links|prescriptions|dashboard)(/|$) {
        if ($http_accept ~* text/html) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout 120s;
    }

    location /media/ {
        alias /var/lib/chainopharma/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Admin panel
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.15-252-130-60.sslip.io;

    ssl_certificate /etc/letsencrypt/live/admin.15-252-130-60.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.15-252-130-60.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/chainopharma/admin;
    index index.html;
    client_max_body_size 25m;

    location ~ ^/(hello|auth|admin)(/|$) {
        proxy_pass http://127.0.0.1:4005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
